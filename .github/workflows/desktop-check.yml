name: Desktop privacy and packaging checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  safe-source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run verify:desktop
      - name: Validate exported game
        if: hashFiles('game/index.html') != ''
        run: npm run audit:privacy
  windows-package:
    runs-on: windows-2022
    needs: safe-source
    steps:
      - uses: actions/checkout@v4
      - name: Detect existing privacy-approved snapshot
        id: snapshot
        shell: pwsh
        run: |
          if (Test-Path 'game/index.html') { 'found=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Append }
          else { 'found=false' | Out-File -FilePath $env:GITHUB_OUTPUT -Append }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - if: steps.snapshot.outputs.found == 'true'
        run: npm install --no-audit --no-fund
      - run: npm run verify:desktop
      - if: steps.snapshot.outputs.found == 'true'
        run: npm run audit:privacy
      - if: steps.snapshot.outputs.found == 'true'
        run: npm run package:windows
      - name: Test the actual packaged Windows executable and local save reload
        if: steps.snapshot.outputs.found == 'true'
        run: npm run test:electron
      - name: Prove real town simulation and explorable residence in Windows executable
        if: steps.snapshot.outputs.found == 'true'
        run: npm run test:quality
      - if: steps.snapshot.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: RepoTown-Desktop-windows-development
          path: release/*.zip
          retention-days: 7
