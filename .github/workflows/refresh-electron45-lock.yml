name: Refresh pinned Electron 45 lockfile (one-time runtime upgrade)
on:
  push:
    branches: [fix/steam-electron45-supported-runtime-20261108]
permissions:
  contents: write
concurrency:
  group: electron45-lock-refresh
  cancel-in-progress: false
jobs:
  refresh-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate exact lockfile from supported pinned Electron
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Check reproducible lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit updated lockfile for reproducible Windows and Linux installs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'build: lock supported Electron 45.2.3 dependencies [skip ci]'
            git push origin HEAD:fix/steam-electron45-supported-runtime-20261108
          fi
