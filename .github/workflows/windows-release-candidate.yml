name: Release tested Windows playtest build
on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'game/**'
      - 'tests/electron-smoke.mjs'
      - 'tests/steam-quality.mjs'
      - 'tools/third-party-rights.mjs'
      - 'tools/privacy-gate.mjs'
      - 'tools/steam-manifest.mjs'
      - 'package.json'
      - '.github/workflows/windows-release-candidate.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-release-candidate
  cancel-in-progress: false
jobs:
  test-package-publish:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Windows development dependencies
        run: npm install --no-audit --no-fund
      - name: Privacy gate and desktop source checks
        run: npm run test:steam-ready
      - name: Package full Windows game
        run: npm run package:windows
      - name: Launch the real packaged executable
        run: npm run test:electron
      - name: Test town simulation, NPC dispersion and real fictional home entrance
        run: npm run test:quality
      - name: Save in-game quality evidence for reviewer
        uses: actions/upload-artifact@v4
        with:
          name: RepoTown-Windows-quality-evidence
          path: release/playtest-evidence/
          retention-days: 30
      - name: Generate SHA-256 checksums for the exact Windows release files
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -Path release -File | Where-Object { $_.Name -match '^(RepoTown-Desktop-.*-x64\\.zip|RepositoryTown-Setup-.*\\.exe)        uses: actions/upload-artifact@v4
        with:
          name: RepoTown-Desktop-tested-Windows
          path: |
            release/RepoTown-Desktop-*.zip
            release/RepositoryTown-Setup-*.exe
            release/SHA256SUMS.txt
          retention-days: 30
      - name: Publish durable GitHub prerelease for playtesting
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "windows-playtest-$($env:GITHUB_SHA.Substring(0,8))"
          gh release create $tag release/RepoTown-Desktop-*.zip release/RepositoryTown-Setup-*.exe release/SHA256SUMS.txt --prerelease --title "Repository Town Windows playtest ($tag)" --notes "Verified unsigned development ZIP and Windows installer; NOT a Steam release. Privacy scan passed; real Windows executable, WebGL world and local-save reload passed. Extract ZIP and run Repository Town.exe. Current multiplayer is shared player presence only. Commercial rights and Steamworks review remain open."
 })
          if ($files.Count -ne 2) { throw "Expected Windows installer and ZIP, found $($files.Count)." }
          $lines = $files | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          Set-Content -Path release/SHA256SUMS.txt -Value $lines -Encoding utf8
      - name: Upload tested ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: RepoTown-Desktop-tested-Windows
          path: |
            release/RepoTown-Desktop-*.zip
            release/RepositoryTown-Setup-*.exe
          retention-days: 30
      - name: Publish durable GitHub prerelease for playtesting
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "windows-playtest-$($env:GITHUB_SHA.Substring(0,8))"
          gh release create $tag release/RepoTown-Desktop-*.zip release/RepositoryTown-Setup-*.exe --prerelease --title "Repository Town Windows playtest ($tag)" --notes "Verified unsigned development ZIP and Windows installer; NOT a Steam release. Privacy scan passed; real Windows executable, WebGL world and local-save reload passed. Extract ZIP and run Repository Town.exe. Current multiplayer is shared player presence only. Commercial rights and Steamworks review remain open."
