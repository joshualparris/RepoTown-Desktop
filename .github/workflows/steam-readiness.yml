name: Steam readiness gate
on:
  push:
    branches: [main]
    paths:
      - 'tools/itch-assets.mjs'
      - 'tools/itch-readiness.mjs'
      - 'store/itch/**'
      - 'desktop/**'
      - 'game/**'
      - 'tests/**'
      - 'tools/steam-readiness.mjs'
      - 'tools/capsules.mjs'
      - 'tools/screenshots.mjs'
      - 'store/**'
      - 'package.json'
      - '.github/workflows/steam-readiness.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tools/itch-assets.mjs'
      - 'tools/itch-readiness.mjs'
      - 'store/itch/**'
      - 'desktop/**'
      - 'game/**'
      - 'tests/**'
      - 'tools/steam-readiness.mjs'
      - 'tools/capsules.mjs'
      - 'tools/screenshots.mjs'
      - 'store/**'
      - 'package.json'
      - '.github/workflows/steam-readiness.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1' # weekly drift check (assets, snapshot, docs)
permissions:
  contents: write
concurrency:
  group: steam-readiness
  cancel-in-progress: false
jobs:
  readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned dependencies (includes Playwright)
        run: npm install --no-audit --no-fund
      - name: Ensure Playwright Chromium is present
        run: npx playwright install chromium --with-deps || npx playwright install chromium
      - name: Install Xvfb and Electron runtime libraries
        run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0t64 libnss3 libasound2t64 libgbm1 libxss1 libxkbcommon0
      - name: Shell syntax, privacy gate and achievement tests
        run: npm run test:steam-ready
      - name: Verify optional Steamworks client achievement API without publisher credentials
        run: npm run test:steam-bridge
      - name: Electron shell end-to-end on Linux (achievements bridge, --no-sandbox)
        run: xvfb-run -a npm run test:desktop-achievements
      - name: Regenerate capsule artwork (dimension check)
        run: npm run store:capsules
      - name: itch.io release readiness (free platform path)
        run: npm run itch:ready
      - name: Steam readiness gate (build config, assets, integration surface)
        run: npm run steam:ready
      - name: Commit exact-size Steam artwork after validation on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add store/capsules desktop/assets/icon.png
          if ! git diff --cached --quiet; then
            git commit -m 'art(steam): regenerate exact-size compliant base artwork [skip ci]'
            git push origin HEAD:main
          fi
      - name: Upload readiness report and store assets
        uses: actions/upload-artifact@v4
        with:
          name: steam-readiness-report
          path: |
            store/capsules
            store/screenshots
          if-no-files-found: error
  windows-electron-achievements:
    runs-on: windows-2022
    needs: readiness
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Exercise Electron achievement bridge on actual Windows
        run: npm run test:desktop-achievements
